name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "15 1 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
#      - name: Checkout the repository
#        uses: "actions/checkout@v4"
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"

  hassfest:
    name: HASSFest
    runs-on: "ubuntu-latest"
    steps:
        - name: Checkout the repository
          uses: "actions/checkout@v4"
        - name: Hassfest validation
          uses: "home-assistant/actions/hassfest@master"
