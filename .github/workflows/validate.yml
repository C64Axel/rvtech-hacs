name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron:  '15 1 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
        - name: HACS validation
          uses: "hacs/action@main"
          with:
            category: "integration"
